name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install check runners
        run: brew install gitleaks uv

      - name: Lint shell scripts
        run: |
          bash -n gg
          bash -n install.sh
          for f in checks/*.sh; do bash -n "$f"; done

      - name: Run test suite
        run: bun test tests/gg.test.ts

      - name: Smoke check
        run: ./gg --version
