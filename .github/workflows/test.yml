name: test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install check runners
        run: brew install gitleaks uv jq coreutils

      - name: Prepare pinned review runners
        run: ./gg setup

      - name: Lint shell scripts
        # /bin/bash is deliberate, not incidental: macOS ships bash 3.2 and
        # always will, so that is the oldest interpreter a user can land on.
        # Linting with a Homebrew bash 5 on PATH hides mapfile and empty-case-arm
        # errors that break every check on a stock machine.
        run: |
          /bin/bash --version | head -1
          /bin/bash -n gg
          /bin/bash -n install.sh
          /bin/bash -n setup.sh
          /bin/bash -n snapshot.sh
          /bin/bash -n update-check.sh
          for f in checks/*.sh; do /bin/bash -n "$f"; done

      - name: Run test suite
        run: bun test tests/

      - name: Smoke check
        run: ./gg --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(sed -n 's/^GG_VERSION="\([^" ]*\)"$/\1/p' gg)
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --latest
